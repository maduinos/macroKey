[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macrokey"
version = "0.5.0"
description = "Config app for the Maduinos macroKey keypad (GUI; ship via ./build_release.sh)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Maduinos" }]
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
# The editor window. Left optional so a headless box can install the CLI without
# pulling in Qt; every command other than `macrokey gui` works without it.
gui = ["PySide6>=6.6"]
# Input capture for recording macros onto the pad. Without it the device still
# works; only the recorder is unavailable. evdev is required under Wayland;
# pynput covers X11 and is the fallback elsewhere.
input = ["pynput>=1.7", "evdev>=1.6; platform_system=='Linux'"]
dev = ["pytest>=7", "ruff>=0.4", "pyinstaller>=6"]

[project.scripts]
macrokey = "macrokey.cli:main"

[tool.setuptools.packages.find]
include = ["macrokey*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
