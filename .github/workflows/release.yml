# 커밋(main push)마다 Linux/Windows 실행 파일을 빌드해 릴리스에 올린다.
#
#   push main       -> `latest` 롤링 프리릴리스를 매번 새로 만든다 (개발 빌드)
#   push tag v*     -> 해당 태그로 정식 릴리스를 만든다 (예: v0.5.0)
#
# 빌드는 로컬과 같은 ./build_release.sh 를 쓴다. 테스트는 아래 test 잡에서
# 한 번만 돌리고, 빌드 잡은 --skip-tests 로 중복 실행을 피한다.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt 런타임 라이브러리 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libdbus-1-3
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: macrokey-linux-x86_64
            built: releases/linux/macrokey
          - os: windows-latest
            asset: macrokey-windows-x86_64.exe
            built: releases/windows/macrokey.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt 런타임 라이브러리 설치 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libdbus-1-3
      - name: 빌드
        shell: bash
        run: ./build_release.sh --skip-tests
      - name: 결과물 이름 정리
        shell: bash
        run: |
          mkdir -p artifacts
          cp "${{ matrix.built }}" "artifacts/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: artifacts/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 체크섬
        run: |
          cd dist
          chmod +x macrokey-linux-x86_64
          sha256sum * > SHA256SUMS.txt
          ls -l
      - name: 릴리스 업로드
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          short="${GITHUB_SHA::7}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
            title="macroKey $tag"
            prerelease=""
          else
            tag="latest"
            title="macroKey dev build (v$version, $short)"
            prerelease="--prerelease"
            # 롤링 태그라 이전 릴리스/태그를 지우고 현재 커밋으로 다시 만든다.
            gh release delete "$tag" --cleanup-tag --yes || true
          fi
          notes="$(printf '%s\n' \
            "커밋 \`$short\` 자동 빌드 (v$version)" \
            "" \
            "- \`macrokey-linux-x86_64\` - Linux 실행 파일 (\`chmod +x\` 후 실행)" \
            "- \`macrokey-windows-x86_64.exe\` - Windows 실행 파일")"
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes "$notes" \
            $prerelease
