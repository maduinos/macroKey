# 커밋(main push)마다 Linux/Windows 실행 파일을 빌드해 릴리스에 올린다.
#
#   push main       -> `latest` 롤링 프리릴리스를 매번 새로 만든다 (개발 빌드)
#   push tag v*     -> 해당 태그로 정식 릴리스를 만든다 (예: v0.5.0)
#
# 빌드는 로컬과 같은 ./build_release.sh 를 쓴다. 테스트는 아래 test 잡에서
# 한 번만 돌리고, 빌드 잡은 --skip-tests 로 중복 실행을 피한다.
#
# firmware 잡이 등록된 모든 보드의 펌웨어를 굽는다. 그 이미지는 (1) 앱 바이너리 안에
# 번들되어 사용자가 arduino-cli 없이 키패드를 플래싱할 수 있게 하고, (2) 릴리스에도
# 따로 첨부된다. 보드 목록은 macrokey/boards.py 하나에서 나오므로 보드를 추가해도
# 이 파일은 건드릴 필요가 없다.
#
# Ubuntu 러너는 22.04로 고정한다. ubuntu-latest(24.04, glibc 2.39)에서 빌드하면
# 결과물이 GLIBC_2.38을 요구해 22.04 이하에서 실행되지 않는다.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt 런타임 라이브러리 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libdbus-1-3
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: ruff
        run: python -m ruff check .

  firmware:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: arduino-cli 설치
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: 모든 보드 펌웨어 빌드
        run: ./tools/build_firmware.sh
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/prebuilt/
          if-no-files-found: error

  build:
    needs: [test, firmware]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: macrokey-linux-x86_64
            built: releases/linux/macrokey
          - os: windows-latest
            asset: macrokey-windows-x86_64.exe
            built: releases/windows/macrokey.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt 런타임 라이브러리 설치 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libdbus-1-3
      # 앱 바이너리에 들어갈 펌웨어. 없으면 build_release.sh가 경고만 하고 넘어가므로
      # 여기서 받아오지 않으면 플래싱 못 하는 앱이 조용히 릴리스된다.
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware/prebuilt
      - name: 빌드
        shell: bash
        run: ./build_release.sh --skip-tests
      - name: 결과물 이름 정리
        shell: bash
        run: |
          mkdir -p artifacts
          cp "${{ matrix.built }}" "artifacts/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: artifacts/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 체크섬
        run: |
          cd dist
          chmod +x macrokey-linux-x86_64
          sha256sum * > SHA256SUMS.txt
          ls -l
      - name: 릴리스 업로드
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 22.04 러너의 python은 3.10이라 tomllib이 없다. 한 줄이라 sed로 충분하다.
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          short="${GITHUB_SHA::7}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
            title="macroKey $tag"
            prerelease=""
          else
            tag="latest"
            title="macroKey dev build (v$version, $short)"
            prerelease="--prerelease"
            # 롤링 태그라 이전 릴리스/태그를 지우고 현재 커밋으로 다시 만든다.
            gh release delete "$tag" --cleanup-tag --yes || true
          fi
          notes="$(printf '%s\n' \
            "커밋 \`$short\` 자동 빌드 (v$version)" \
            "" \
            "- \`macrokey-linux-x86_64\` - Linux 실행 파일 (\`chmod +x\` 후 실행)" \
            "- \`macrokey-windows-x86_64.exe\` - Windows 실행 파일" \
            "" \
            "펌웨어는 실행 파일 안에 들어 있습니다. 키패드를 USB로 꽂고 앱을 켜면" \
            "어떤 보드인지 알아보고 확인을 받은 뒤 직접 설치합니다 (\`macrokey flash\`)." \
            "아래 이미지는 직접 굽고 싶을 때만 필요합니다." \
            "" \
            "- \`firmware-promicro.hex\` - Pro Micro (ATmega32u4)" \
            "- \`firmware-promicro-rp2040.uf2\` - ProMicro RP2040")"
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes "$notes" \
            $prerelease
