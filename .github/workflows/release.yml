# 커밋(main push)마다 Linux/Windows 실행 파일을 빌드해 릴리스에 올린다.
#
#   push main       -> `latest` 롤링 프리릴리스를 매번 새로 만든다 (개발 빌드)
#   push tag v*     -> 해당 태그로 정식 릴리스를 만든다 (예: v0.5.0)
#
# 빌드는 로컬과 같은 ./build_release.sh 를 쓴다. 테스트는 아래 test 잡에서
# 한 번만 돌리고, 빌드 잡은 --skip-tests 로 중복 실행을 피한다.
#
# 문서만 바뀐 커밋은 gate 잡이 걸러낸다. 트리거의 paths-ignore를 쓰지 않는 이유는
# 태그 때문이다 — 이미 push된 커밋에 태그만 붙이면 그 push에 담긴 커밋이 0개라
# 경로 필터가 아무것도 못 맞추고 정식 릴리스가 통째로 스킵된다. 태그는 무조건 통과시키고
# main push일 때만 바뀐 파일을 보는 편이 안전하다.
#
# firmware 잡이 등록된 모든 보드의 펌웨어를 굽는다. 그 이미지는 (1) 앱 바이너리 안에
# 번들되어 사용자가 arduino-cli 없이 키패드를 플래싱할 수 있게 하고, (2) 릴리스에도
# 따로 첨부된다. 보드 목록은 macrokey/boards.py 하나에서 나오므로 보드를 추가해도
# 이 파일은 건드릴 필요가 없다.
#
# Ubuntu 러너는 22.04로 고정한다. ubuntu-latest(24.04, glibc 2.39)에서 빌드하면
# 결과물이 GLIBC_2.38을 요구해 22.04 이하에서 실행되지 않는다.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 빌드를 돌릴 가치가 있는 push인지 한 번만 판단한다. 태그는 항상 참이고, main push는
  # 문서(.md, docs/) 밖의 파일이 하나라도 바뀌었을 때만 참이다.
  gate:
    runs-on: ubuntu-22.04
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: decide
        run: |
          if [[ "${{ github.ref_type }}" == "tag" || "${{ github.event_name }}" != "push" ]]; then
            echo "태그 또는 수동 실행 - 빌드한다"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 첫 커밋이거나 부모를 못 찾으면 판단을 포기하고 빌드한다.
          if ! git rev-parse -q --verify HEAD^ >/dev/null; then
            echo "부모 커밋 없음 - 빌드한다"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^ HEAD)
          echo "바뀐 파일:"; echo "$changed"
          # grep -qv 는 구현에 따라 종료 코드가 갈린다. 남은 줄이 있는지로 판단한다.
          code=$(printf '%s\n' "$changed" | grep -vE '(^docs/|\.md$)' || true)
          if [ -n "$code" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "문서만 바뀌었다 - 빌드를 건너뛴다"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt 런타임 라이브러리 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libdbus-1-3
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: ruff
        run: python -m ruff check .

  firmware:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: arduino-cli 설치
        run: |
          # 설치 스크립트는 BINDIR을 만들어 주지 않고, 없으면 거부한다.
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: 모든 보드 펌웨어 빌드
        run: ./tools/build_firmware.sh
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/prebuilt/
          if-no-files-found: error

  build:
    needs: [test, firmware]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: macrokey-linux-x86_64
            built: releases/linux/macrokey
          - os: windows-latest
            asset: macrokey-windows-x86_64.exe
            built: releases/windows/macrokey.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt 런타임 라이브러리 설치 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libdbus-1-3
      # 앱 바이너리에 들어갈 펌웨어. 없으면 build_release.sh가 경고만 하고 넘어가므로
      # 여기서 받아오지 않으면 플래싱 못 하는 앱이 조용히 릴리스된다.
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware/prebuilt
      - name: 빌드
        shell: bash
        run: ./build_release.sh --skip-tests
      - name: 결과물 이름 정리
        shell: bash
        run: |
          mkdir -p artifacts
          cp "${{ matrix.built }}" "artifacts/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: artifacts/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 체크섬
        run: |
          cd dist
          chmod +x macrokey-linux-x86_64
          sha256sum * > SHA256SUMS.txt
          ls -l
      - name: 릴리스 업로드
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 22.04 러너의 python은 3.10이라 tomllib이 없다. 한 줄이라 sed로 충분하다.
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          short="${GITHUB_SHA::7}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
            title="macroKey $tag"
            prerelease=""
          else
            tag="latest"
            title="macroKey dev build (v$version, $short)"
            prerelease="--prerelease"
            # 롤링 태그라 이전 릴리스/태그를 지우고 현재 커밋으로 다시 만든다.
            gh release delete "$tag" --cleanup-tag --yes || true
          fi
          # 무엇이 바뀌었는지가 먼저다. 앱이 릴리스를 스스로 받아 설치한 뒤
          # 이 본문을 그대로 사용자에게 보여주므로, 파일 목록만 있으면
          # "왜 앱이 달라졌는지"에 아무도 답하지 못한다. `---` 위쪽이 앱이
          # 읽는 부분이고, 아래쪽은 릴리스 페이지용 파일 안내다.
          changelog="$(python3 tools/release_notes.py "$version" || true)"
          if [[ -z "$changelog" ]]; then
            changelog="커밋 \`$short\` 자동 빌드 (v$version)"
          fi
          notes="$(printf '%s\n' \
            "$changelog" \
            "" \
            "---" \
            "" \
            "커밋 \`$short\` 자동 빌드 (v$version)" \
            "" \
            "- \`macrokey-linux-x86_64\` - Linux 실행 파일 (\`chmod +x\` 후 실행)" \
            "- \`macrokey-windows-x86_64.exe\` - Windows 실행 파일" \
            "" \
            "펌웨어는 실행 파일 안에 들어 있습니다. 키패드를 USB로 꽂고 앱을 켜면" \
            "어떤 보드인지 알아보고 확인을 받은 뒤 직접 설치합니다 (\`macrokey flash\`)." \
            "아래 이미지는 직접 굽고 싶을 때만 필요합니다." \
            "" \
            "- \`firmware-promicro.hex\` - Pro Micro (ATmega32u4)" \
            "- \`firmware-promicro-rp2040.uf2\` - ProMicro RP2040")"
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes "$notes" \
            $prerelease
